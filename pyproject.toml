[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melt"
version = "0.1.0"
description = "Clipboard capture that keeps source immutable and digest derived."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6"]

# ponytail: locales/ stays at the repo root for the helper and hotkeys;
# the wheel maps it to melt/locales, which i18n.catalog_path() checks first.
[tool.setuptools]
packages = ["melt", "melt.locales"]

[tool.setuptools.package-dir]
"" = "src"
"melt.locales" = "locales"

[tool.setuptools.package-data]
melt = ["templates/*.html", "static/*"]
"melt.locales" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
