[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melt"
version = "0.1.0"
description = "Clipboard capture that keeps source immutable and digest derived."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # The login form is the one form post left; everything else is JSON.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6"]

# ponytail: locales/ stays at the repo root for the helper and hotkeys;
# the wheel maps it to melt/locales, which i18n.catalog_path() checks first.
[tool.setuptools]
packages = ["melt", "melt.locales"]

[tool.setuptools.package-dir]
"" = "src"
"melt.locales" = "locales"

[tool.setuptools.package-data]
# static/ui/ is built from ui/ by scripts/build-ui.sh and committed, so the
# wheel needs no Rust toolchain.
# Recursive: wasm-bindgen nests loader snippets under
# static/ui/snippets/<crate>/src/js/, and a shallow glob silently drops them.
melt = ["static/**/*"]
"melt.locales" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
