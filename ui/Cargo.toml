[package]
name = "melt-ui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Dioxus web client for the melt inbox."

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Navigator",
  "Clipboard",
  "Storage",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "MediaQueryList",
]

# A hand-rolled `scripts/build-ui.sh` drives cargo + wasm-bindgen, so the
# profile has to do the size work that `dx bundle` would otherwise do.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
