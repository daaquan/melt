<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ t("login.title", catalog) }}</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <form class="login-form" method="post" action="/v1/login">
    <h1>{{ t("login.title", catalog) }}</h1>
    {% if error %}
    <p class="err">{{ t("login.error", catalog) }}</p>
    {% endif %}
    <label for="token">{{ t("login.token_label", catalog) }}</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required />
    <p class="hint">{{ t("login.token_hint", catalog) }}</p>
    <button type="submit">{{ t("login.submit", catalog) }}</button>
  </form>
</body>
</html>
